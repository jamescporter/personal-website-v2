name: Format homepage redesign

on:
  push:
    branches:
      - redesign-professional-homepage
    paths:
      - ".github/workflows/format-homepage.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          ref: redesign-professional-homepage
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format homepage files
        run: npx prettier _pages/about.md assets/css/home.css --write
      - name: Commit formatted files and remove temporary helper
        run: |
          rm .github/workflows/format-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pages/about.md assets/css/home.css .github/workflows/format-homepage.yml
          git commit -m "Format redesigned homepage for Prettier"
          git push origin HEAD:redesign-professional-homepage
