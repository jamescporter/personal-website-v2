name: Format experience profile PR

on:
  push:
    branches:
      - build-curated-experience-education-page
    paths:
      - ".github/workflows/format-experience-pr.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: build-curated-experience-education-page
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed site files
        run: npx prettier _pages/cv.md _pages/about.md _pages/about-me.md assets/css/experience.css --write
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/format-experience-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pages/cv.md _pages/about.md _pages/about-me.md assets/css/experience.css .github/workflows/format-experience-pr.yml
          git commit -m "Format curated experience profile"
          git push origin HEAD:build-curated-experience-education-page
