name: Capture website visual review

on:
  push:
    branches:
      - review/automated-visual-captures
    paths:
      - ".github/workflows/capture-visual-review.yml"
      - "scripts/capture_visual_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and PDF renderer
        run: |
          python -m pip install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Capture live site at desktop/mobile and print sizes
        run: python scripts/capture_visual_review.py
      - name: Upload images and printable PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-review
          path: visual-review/
          retention-days: 30
          if-no-files-found: warn
